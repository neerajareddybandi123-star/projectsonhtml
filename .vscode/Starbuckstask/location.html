<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Starbucks Store Locator</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Navbar */
    .navbar {
      height: 100px;
      background-color: #ffffff;
      border-bottom: 1px solid #d5d5d5;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .logo {
      width: 65px;
      height: 65px;
      border-radius: 50%;
    }

    .nav-link {
      color: #222 !important;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-left: 15px;
    }

    .store-link {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .sign-btn {
      border: 1px solid #333;
      border-radius: 25px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      background-color: white;
    }

    .join-btn {
      border-radius: 25px;
      padding: 9px 22px;
      font-size: 14px;
      font-weight: 600;
      background-color: #000;
      color: white;
      border: none;
    }
.nav-link{
    transition: color 0.3s ease;
}
.nav-link:hover{
    color:#00754a;
}
.store-link{
    cursor: pointer;
    transition: color 0.3s ease;
}
.store-link:hover{
    color:#00754a;
}
.sign-btn{
    transition: all 0.3s ease;
}
.sign-btn:hover{
    background-color:gray ;
    color:white;
    transform: scale(1.05);
}
.nav-sec{
     transition: color 0.3s ease;

}
 .nav-link {
    transition: color 0.3s ease; 
}
.nav-sec:hover 
{
     color: #00754a ;

}.nav-link:hover {
  color: #00754a ;
 
  
}
    .main-section {
      height: calc(100vh - 100px);
    }
    .sidebar {
      height: 100%;
      background-color: #f7f7f7;
      border-right: 1px solid #d2d2d2;
      overflow-y: auto;
    }

    .pickup-delivery {
      width: 300px;
      margin: 20px auto 30px;
      border: 1px solid #00754a;
      border-radius: 30px;
      overflow: hidden;
    }

    .pickup-btn,
    .delivery-btn {
      width: 50%;
      border: none;
      padding: 9px;
      font-size: 16px;
      font-weight: 600;
      background: transparent;
      color: #17664e;
    }

    .pickup-btn {
      background-color: #00754a;
      color: white;
      border-radius: 25px;
    }
    .search-box {
      margin: 0 25px;
      border-bottom: 1px solid #999;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 18px;
      width: 100%;
      padding-bottom: 7px;
    }

    .filter-btn {
      border: 1px solid #4d8876;
      color: #256c57;
      background-color: white;
      border-radius: 25px;
      padding: 8px 17px;
      font-weight: 600;
    }

    .sidebar-content {
      padding: 45px 25px;
    }

    .sidebar-content h2 {
      font-size: 29px;
      font-weight: 700;
      color: #303030;
    }

    .sidebar-content p {
      font-size: 16px;
      color: #5b5b5b;
      margin-top: 18px;
    }

    .footer-links {
      margin-top: 50px;
    }

    .footer-links a {
      display: block;
      text-decoration: none;
      color: #315f52;
      font-size: 16px;
      margin-bottom: 20px;
    }

    .map-section {
      height: 100%;
      position: relative;
      background-color: #dedbd4;
      overflow: hidden;
    }

    .map-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }
    .map-controls {
      position: absolute;
      right: 25px;
      bottom: 45px;
    }

    .map-controls button {
      width: 45px;
      height: 45px;
      display: block;
      background: white;
      border: 1px solid #ccc;
      font-size: 23px;
    }

    .fullscreen-btn {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: none;
      background: white;
      font-size: 22px;
    }

    @media (max-width: 991px) {

      body {
        overflow-y: auto;
      }

      .navbar {
        height: auto;
      }

      .main-section {
        height: auto;
      }

      .sidebar {
        height: auto;
        min-height: 550px;
      }

      .map-section {
        height: 500px;
      }

      .nav-link {
        margin-left: 0;
      }
    }
    .store-link a{
        text-decoration: none;
        color:black;

    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand-lg px-3 nav-sec">
<a class="navbar-brand" href="homepage.html">
            <img src="https://upload.wikimedia.org/wikipedia/en/d/d3/Starbucks_Corporation_Logo_2011.svg"
            width="50" alt="imgnotfound">
        </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarMenu"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarMenu">

      <div class="navbar-nav">

        <a class="nav-link" href="menupage.html">MENU</a>
        <a class="nav-link" href="Rewards.css">REWARDS</a>
        <a class="nav-link" href="giftcard.css">GIFT CARDS</a>

      </div>

      <div class="ms-auto d-flex align-items-center gap-3">

        <div class="store-link">
          <i class="bi bi-geo-alt-fill me-2"></i>
           <a href="location.html">Find a store</a>
        </div>

        <button class="sign-btn">
          Sign in
        </button>

        <button class="join-btn">
          Join now
        </button>

      </div>

    </div>

  </nav>


  <!-- Main Area -->
  <div class="container-fluid p-0">

    <div class="row g-0 main-section">

      <!-- Left Sidebar -->
      <div class="col-lg-5 sidebar">

        <!-- Pickup and Delivery -->
        <div class="pickup-delivery d-flex">

          <button class="pickup-btn">
            Pickup
          </button>

          <button class="delivery-btn">
            Delivery
          </button>

        </div>


        <!-- Search -->
        <div class="d-flex align-items-center">

          <div class="search-box flex-grow-1">

            <div class="d-flex align-items-center">

              <input
                type="text"
                placeholder="Find a store"
              >

              <i class="bi bi-search fs-3 text-secondary"></i>

            </div>

          </div>

          <button class="filter-btn me-4">
            Filter
          </button>

        </div>


        <!-- Content -->
        <div class="sidebar-content">

          <h2>Zoomed out too far</h2>

          <p>
            Try searching for a location or zooming in to see results.
          </p>


          <!-- Links -->
          <div class="footer-links">

            <a href="#">
              Privacy Notice
              <i class="bi bi-box-arrow-up-right"></i>
            </a>

            <a href="#">
              Terms of Use
              <i class="bi bi-box-arrow-up-right"></i>
            </a>

            <a href="#">
              Do Not Share My Personal Information
              <i class="bi bi-box-arrow-up-right"></i>
            </a>

          </div>

        </div>

      </div>


      
      <div class="col-lg-7 map-section">

      
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5724.516839866276!2d78.60828561152567!3d14.495094926905606!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb39d66127c7c9b%3A0x79b6509e8be99df!2zTSDgsJrgsYzgsJ_gsKrgsLLgsY3gsLLgsL8!5e0!3m2!1sen!2sin!4v1785493322638!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

     
        <div class="map-controls">

          <button>
            +
          </button>

          <button>
            −
          </button>

        </div>

        <button class="fullscreen-btn">

          <i class="bi bi-arrows-fullscreen"></i>

        </button>

      </div>

    </div>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
